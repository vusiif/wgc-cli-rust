name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: rgc-cli.exe
            archive_name: rgc-cli-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: rgc-cli
            archive_name: rgc-cli-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: rgc-cli
            archive_name: rgc-cli-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: rgc-cli
            archive_name: rgc-cli-macos-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libpipewire-0.3-dev libspa-0.2-dev libegl1-mesa-dev libgbm-dev libdrm-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          Compress-Archive -Path $bin, "README.md", "README_zh.md", "LICENSE" -DestinationPath "${{ matrix.archive_name }}"
          $hash = (Get-FileHash -Path "${{ matrix.archive_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive_name }}" | Out-File -FilePath "${{ matrix.archive_name }}.sha256" -Encoding ascii

      - name: Package release archive (UNIX)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" .
          tar -czf "${{ matrix.archive_name }}" "${{ matrix.bin_name }}" README.md README_zh.md LICENSE
          shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
