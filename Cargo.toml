[package]
name = "rgc-cli"
version = "2.0.0"
edition = "2021"
description = "Cross-platform screen capture CLI utility written in Rust"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
arboard = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "0.9", features = ["wgc"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
xcap = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
